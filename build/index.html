<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qkey Docs</title>
    <meta name="description" content="Beautiful, searchable documentation with zero dependencies">
    
    <!-- Accessibility and SEO meta tags -->
    <meta name="theme-color" content="#2563eb">
    <meta name="color-scheme" content="light dark">
    
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/themes.css">
    <link rel="stylesheet" href="styles/print.css" media="print">
</head>
<body>
    <div id="app" class="app">
        <!-- Skip to content link for screen readers -->
        <a href="#main-content" class="skip-link">Skip to main content</a>
        
        <!-- Header -->
        <header class="header" role="banner">
            <div class="header-content">
                <div class="logo">
                    <h1>Qkey Docs</h1>
                </div>
                
                <nav class="header-nav" role="navigation" aria-label="Main navigation">
                    <div class="search-container">
                        <label for="search-input" class="sr-only">Search documentation</label>
                        <input 
                            type="search" 
                            id="search-input" 
                            class="search-input" 
                            placeholder="Search docs..." 
                            autocomplete="off"
                            aria-describedby="search-results-count"
                        >
                        <div id="search-results" class="search-results" role="listbox" aria-label="Search results"></div>
                        <div id="search-results-count" class="sr-only" aria-live="polite"></div>
                    </div>
                    
                    <button 
                        id="theme-toggle" 
                        class="theme-toggle" 
                        aria-label="Toggle dark mode"
                        title="Toggle dark mode"
                    >
                        <span class="theme-icon light-icon" aria-hidden="true">☀️</span>
                        <span class="theme-icon dark-icon" aria-hidden="true">🌙</span>
                    </button>
                    
                    <button 
                        id="menu-toggle" 
                        class="menu-toggle" 
                        aria-label="Toggle navigation menu"
                        aria-expanded="false"
                    >
                        <span class="menu-icon"></span>
                    </button>
                </nav>
            </div>
        </header>

        <!-- Main layout -->
        <div class="main-layout">
            <!-- Sidebar -->
            <aside class="sidebar" role="navigation" aria-label="Documentation navigation">
                <div class="sidebar-content">
                    <nav id="toc" class="table-of-contents">
                        <h2>Contents</h2>
                        <ul class="toc-list" role="tree">
                            <!-- Table of contents will be populated by JavaScript -->
                        </ul>
                    </nav>
                </div>
            </aside>

            <!-- Main content -->
            <main id="main-content" class="main-content" role="main" tabindex="-1">
                <div class="content-wrapper">
                    <article id="content" class="content">
                        <!-- Content will be populated by JavaScript -->
                        <div class="loading">
                            <div class="loading-spinner" aria-hidden="true"></div>
                            <p>Loading documentation...</p>
                        </div>
                    </article>
                    
                    <!-- Page navigation -->
                    <nav class="page-nav" role="navigation" aria-label="Page navigation">
                        <div class="page-nav-content">
                            <a href="#" id="prev-page" class="page-nav-link prev hidden" rel="prev">
                                <span aria-hidden="true">←</span>
                                <span class="page-nav-text">
                                    <small>Previous</small>
                                    <span class="page-nav-title"></span>
                                </span>
                            </a>
                            
                            <a href="#" id="next-page" class="page-nav-link next hidden" rel="next">
                                <span class="page-nav-text">
                                    <small>Next</small>
                                    <span class="page-nav-title"></span>
                                </span>
                                <span aria-hidden="true">→</span>
                            </a>
                        </div>
                    </nav>
                </div>
            </main>
        </div>
    </div>

    <!-- Scripts -->
    <script src="config.js"></script>
    <script src="js/markdown-parser.js"></script>
    <script src="js/search.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/themes.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
